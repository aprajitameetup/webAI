<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The New Web AI Stack · Learning Hub</title>
<style>
  :root{
    --bg:#0a0e14;--surface:#11161f;--surface2:#1a212e;--border:#2a3342;
    --accent:#58a6ff;--accent2:#3fb950;--accent3:#f78166;--accent4:#d2a8ff;
    --yellow:#e3b341;--orange:#f0883e;--cyan:#39d0d8;
    --text:#e6edf3;--muted:#8b949e;--dim:#4a5568;
    --r:8px;--r2:14px;--t:.2s cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Inter',sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column}

  /* TOP BAR */
  .topbar{display:flex;align-items:center;gap:14px;padding:0 20px;height:54px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
  .brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
  .brand .logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent4));display:flex;align-items:center;justify-content:center;font-size:14px}
  .brand small{font-weight:500;color:var(--muted);font-size:11px}
  .topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
  .live-pill{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--muted);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
  .live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent2);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(1.35)}}
  .progress-mini{font-size:11px;color:var(--muted);font-weight:600}

  .layout{flex:1;display:flex;overflow:hidden;min-height:0}

  /* SIDEBAR NAV */
  .nav{width:248px;background:var(--surface);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;padding:12px 10px}
  .nav-group-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--dim);padding:14px 10px 6px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r);cursor:pointer;font-size:13px;font-weight:500;color:var(--muted);transition:var(--t);border:1px solid transparent}
  .nav-item:hover{background:var(--surface2);color:var(--text)}
  .nav-item.active{background:var(--surface2);color:var(--text);border-color:var(--border)}
  .nav-item .ico{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;background:var(--bg)}
  .nav-item.active .ico{background:linear-gradient(135deg,var(--accent),var(--accent4))}
  .nav-item .chk{margin-left:auto;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--dim);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:var(--t)}
  .nav-item .chk.done{background:var(--accent2);border-color:var(--accent2);color:#06140a}

  /* CONTENT */
  .content{flex:1;overflow-y:auto;padding:32px 44px}
  .page{display:none;max-width:920px;margin:0 auto;animation:fade .25s ease}
  .page.active{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

  .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .eyebrow::before{content:'';width:18px;height:2px;background:var(--accent)}
  h1{font-size:34px;font-weight:900;line-height:1.15;letter-spacing:-.8px;margin-bottom:12px;background:linear-gradient(135deg,#e6edf3 35%,#79c0ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  h2{font-size:22px;font-weight:800;margin:28px 0 12px;letter-spacing:-.3px;display:flex;align-items:center;gap:9px}
  h3{font-size:15px;font-weight:700;margin:18px 0 8px;color:var(--text)}
  .lead{font-size:16px;color:var(--muted);line-height:1.6;margin-bottom:8px;max-width:680px}
  p{font-size:14px;line-height:1.7;color:#c2ccd6;margin-bottom:12px}
  p strong,li strong{color:var(--text)}
  ul{margin:0 0 14px 20px}li{font-size:14px;line-height:1.7;color:#c2ccd6;margin-bottom:5px}
  a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:20px 22px;margin-bottom:16px}
  .card.tinted{background:linear-gradient(135deg,rgba(88,166,255,.06),rgba(210,168,255,.06));border-color:rgba(88,166,255,.2)}

  .pill{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;letter-spacing:.3px}
  .pill.must{background:rgba(247,129,102,.14);color:var(--accent3)}
  .pill.new{background:rgba(210,168,255,.14);color:var(--accent4)}
  .pill.ship{background:rgba(63,185,80,.14);color:var(--accent2)}
  .pill.exp{background:rgba(227,179,65,.14);color:var(--yellow)}

  .takeaway{border-left:3px solid var(--accent2);background:rgba(63,185,80,.06);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin:16px 0;font-size:14px;line-height:1.6}
  .takeaway b{color:var(--accent2)}
  .warn{border-left:3px solid var(--yellow);background:rgba(227,179,65,.06);padding:12px 16px;border-radius:0 var(--r) var(--r) 0;margin:16px 0;font-size:14px;line-height:1.6}
  .warn b{color:var(--yellow)}

  pre{background:#070a0f;border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;overflow-x:auto;margin:10px 0 16px;font-size:12.5px;line-height:1.6;font-family:'SF Mono','Fira Code',Consolas,monospace}
  code{font-family:'SF Mono','Fira Code',Consolas,monospace;font-size:.9em}
  pre code{color:#c9d1d9}
  .tok-key{color:#ff7b72}.tok-fn{color:#d2a8ff}.tok-str{color:#a5d6ff}.tok-com{color:#6e7681;font-style:italic}.tok-num{color:#79c0ff}

  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}

  /* CAPABILITY DASHBOARD */
  .cap-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:16px 0}
  .cap{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
  .cap .status{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;font-weight:700}
  .cap .status.yes{background:rgba(63,185,80,.18);color:var(--accent2)}
  .cap .status.no{background:rgba(247,129,102,.16);color:var(--accent3)}
  .cap .status.partial{background:rgba(227,179,65,.16);color:var(--yellow)}
  .cap .info{min-width:0}
  .cap .info .name{font-size:13px;font-weight:600}
  .cap .info .detail{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* DEMO BLOCKS */
  .demo{background:var(--surface2);border:1px solid var(--border);border-radius:var(--r2);padding:18px;margin:14px 0}
  .demo-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .demo-head .title{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
  .btn{background:var(--accent);color:#04101f;border:none;border-radius:var(--r);padding:8px 16px;font-size:13px;font-weight:700;cursor:pointer;transition:var(--t)}
  .btn:hover{background:#79b8ff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.ghost{background:var(--surface);color:var(--text);border:1px solid var(--border)}
  .btn.ghost:hover{background:var(--border)}
  .demo-out{background:#070a0f;border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;font-family:'SF Mono','Fira Code',monospace;font-size:12px;line-height:1.6;color:var(--accent2);min-height:40px;white-space:pre-wrap;word-break:break-word;max-height:240px;overflow-y:auto}
  .demo-out .err{color:var(--accent3)}
  .demo-out .muted{color:var(--muted)}

  /* TIMELINE / PLAN */
  .day{background:var(--surface);border:1px solid var(--border);border-radius:var(--r2);padding:18px 22px;margin-bottom:14px}
  .day-h{font-size:16px;font-weight:800;color:var(--accent);margin-bottom:4px}
  .day-sub{font-size:12px;color:var(--muted);margin-bottom:12px}
  .task{display:flex;align-items:flex-start;gap:10px;padding:7px 0;font-size:13px;color:#c2ccd6;line-height:1.5}
  .task .tbox{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--dim);flex-shrink:0;margin-top:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;transition:var(--t)}
  .task .tbox.done{background:var(--accent2);border-color:var(--accent2);color:#06140a}
  .task.done span{text-decoration:line-through;color:var(--dim)}

  .res{display:flex;align-items:center;gap:12px;padding:11px 14px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);margin-bottom:8px;transition:var(--t)}
  .res:hover{border-color:var(--accent)}
  .res .rico{width:30px;height:30px;border-radius:7px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
  .res .rbody{min-width:0}
  .res .rt{font-size:13px;font-weight:600}
  .res .rd{font-size:11.5px;color:var(--muted)}

  .stacklayer{display:flex;align-items:center;gap:14px;padding:13px 16px;border-radius:var(--r);margin-bottom:7px;border:1px solid var(--border)}
  .stacklayer .num{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex-shrink:0;background:var(--surface2);color:var(--accent)}
  .stacklayer .ltext{flex:1}
  .stacklayer .ltext b{font-size:14px}
  .stacklayer .ltext span{font-size:12px;color:var(--muted)}

  ::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}::-webkit-scrollbar-thumb:hover{background:var(--dim)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <div class="logo">⚡</div>
    <div>The New Web AI Stack<br/><small>React Delhi · Learning Hub</small></div>
  </div>
  <div class="topbar-right">
    <div class="progress-mini" id="progressMini">0 / 11 explored</div>
    <div class="live-pill"><span class="live-dot"></span> Live in your browser</div>
  </div>
</div>

<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main class="content" id="content"></main>
</div>

<script>
// ════════════════════════════════════════════════════════════════
//  CONTENT MODEL — each section is data; rendered into pages + nav
// ════════════════════════════════════════════════════════════════
const SECTIONS = [
  {
    id:'overview', icon:'🗺️', group:'Start here', title:'Overview',
    html:`
      <div class="eyebrow">The big picture</div>
      <h1>The browser is becoming<br/>a full AI runtime.</h1>
      <p class="lead">Five years ago, "AI in a web app" meant one thing: call a server API. Today the browser itself can run models, talk over real-time transports, store gigabytes of weights, and tap on-device accelerators. This hub walks every layer of that new stack — with live demos that run right here, in <em>your</em> browser.</p>

      <h2>The stack, as layers</h2>
      <div class="stacklayer"><div class="num">1</div><div class="ltext"><b>Compute</b> &nbsp;<span>WebGPU · WebAssembly · WebNN — run the math</span></div></div>
      <div class="stacklayer"><div class="num">2</div><div class="ltext"><b>Runtimes</b> &nbsp;<span>Transformers.js · WebLLM · ONNX Runtime Web · TF.js</span></div></div>
      <div class="stacklayer"><div class="num">3</div><div class="ltext"><b>Built-in AI</b> &nbsp;<span>Prompt API · Gemini Nano on-device</span></div></div>
      <div class="stacklayer"><div class="num">4</div><div class="ltext"><b>Transport</b> &nbsp;<span>WebTransport · SSE · WebRTC — tokens & data in/out</span></div></div>
      <div class="stacklayer"><div class="num">5</div><div class="ltext"><b>Storage</b> &nbsp;<span>OPFS · Cache API · IndexedDB — hold the weights</span></div></div>
      <div class="stacklayer"><div class="num">6</div><div class="ltext"><b>Concurrency</b> &nbsp;<span>Web Workers · SharedArrayBuffer · COOP/COEP</span></div></div>
      <div class="stacklayer"><div class="num">7</div><div class="ltext"><b>Multimodal I/O</b> &nbsp;<span>WebCodecs · Web Audio — voice & vision</span></div></div>

      <div class="takeaway"><b>The thesis:</b> Compute + Models + Transport + Storage + I/O have all matured at once — so the browser can now be the AI runtime, not just the AI client.</div>

      <h2>How to use this over 3 days</h2>
      <p>Each section has: <strong>what it is</strong>, <strong>why it matters</strong>, a <strong>code snippet</strong>, and where possible a <strong>live demo</strong>. Tick sections off in the sidebar as you go. The <strong>Live Capabilities</strong> tab shows what your current browser supports — start there to see the stack is real.</p>
    `
  },
  {
    id:'capabilities', icon:'🔬', group:'Start here', title:'Live Capabilities', live:'caps',
    html:`
      <div class="eyebrow">Feature detection</div>
      <h1>What can <em>your</em> browser do?</h1>
      <p class="lead">This is real feature detection, run live. Green = available right now. This is the fastest way to internalise "what's shipping vs experimental." Try it in Chrome Canary too — you'll light up more.</p>
      <div class="cap-grid" id="capGrid"></div>
      <div class="warn"><b>Note:</b> some APIs (SharedArrayBuffer, full WebGPU threads) require <b>cross-origin isolation</b> (COOP/COEP headers). Opening this file via <code>file://</code> or a plain static server limits a few of them — that's expected, and itself a lesson (see the Concurrency tab).</div>
    `
  },
  {
    id:'compute', icon:'🧮', group:'The Stack', title:'Compute',
    html:`
      <div class="eyebrow">Layer 1 · Run the math</div>
      <h1>Compute: WebGPU, Wasm, WebNN</h1>
      <p class="lead">Before a model can run in the browser, you need a way to do billions of multiply-adds fast. Three technologies, three trade-offs.</p>

      <h2>🎮 WebGPU <span class="pill ship">Shipping</span></h2>
      <p>The modern GPU API for the web — successor to WebGL, but built for <strong>general compute</strong>, not just graphics. You write <strong>compute shaders</strong> in WGSL and dispatch them across thousands of GPU threads. This is what powers in-browser LLMs (WebLLM) and fast inference.</p>
      <pre><code><span class="tok-key">const</span> adapter = <span class="tok-key">await</span> navigator.gpu.<span class="tok-fn">requestAdapter</span>();
<span class="tok-key">const</span> device  = <span class="tok-key">await</span> adapter.<span class="tok-fn">requestDevice</span>();
<span class="tok-com">// upload buffers, write a WGSL compute shader, dispatch, read back</span></code></pre>
      <div class="demo">
        <div class="demo-head"><div class="title">🎮 Live: WebGPU compute shader</div><button class="btn" id="btn-webgpu">Run a + b on the GPU</button></div>
        <div class="demo-out" id="out-webgpu">Click to request a GPU device and run a tiny element-wise add shader.</div>
      </div>

      <h2>🧩 WebAssembly <span class="pill ship">Shipping</span></h2>
      <p>Near-native CPU performance in the browser. The <strong>fallback path</strong> when WebGPU isn't available, and the foundation for ONNX Runtime Web and llama.cpp ports. Key extensions for AI: <strong>SIMD</strong> (vectorised math), <strong>threads</strong> (needs SharedArrayBuffer), and <strong>Wasm GC</strong>.</p>
      <div class="takeaway"><b>Mental model:</b> WebGPU = the fast lane (GPU), Wasm = the reliable lane (CPU). Good runtimes try WebGPU and fall back to Wasm automatically.</div>

      <h2>🧠 WebNN — Web Neural Network API <span class="pill new">The new one</span></h2>
      <p>This is the piece most "web AI" overviews miss. WebNN is a <strong>W3C standard built specifically for ML inference</strong>. Instead of you hand-writing compute shaders, you describe a <em>graph</em> of neural-network ops and the browser routes it to the OS's native accelerator — <strong>DirectML</strong> (Windows), <strong>Core ML</strong> (Apple), <strong>NNAPI</strong> (Android), even NPUs.</p>
      <ul>
        <li><strong>WebGPU</strong> = low-level, you build the kernels.</li>
        <li><strong>WebNN</strong> = high-level, you describe the model and the OS picks the best hardware (including dedicated AI chips / NPUs).</li>
      </ul>
      <pre><code><span class="tok-key">const</span> context = <span class="tok-key">await</span> navigator.ml.<span class="tok-fn">createContext</span>({ deviceType: <span class="tok-str">'gpu'</span> });
<span class="tok-key">const</span> builder = <span class="tok-key">new</span> <span class="tok-fn">MLGraphBuilder</span>(context);
<span class="tok-com">// describe ops: conv2d, matmul, relu… then build() and compute()</span></code></pre>
      <div class="warn"><b>Status:</b> WebNN is still behind flags in most browsers (Chrome/Edge origin trials). Worth knowing deeply because it's where the platform is heading — and it's the part of the stack most developers haven't met yet.</div>
    `
  },
  {
    id:'runtimes', icon:'📦', group:'The Stack', title:'Models & Runtimes',
    html:`
      <div class="eyebrow">Layer 2 · The frameworks you actually use</div>
      <h1>Models & Runtimes</h1>
      <p class="lead">You rarely touch WebGPU directly — you use a runtime that sits on top of it and falls back to Wasm. These are the libraries to know.</p>

      <h2>🤗 Transformers.js <span class="pill ship">Popular</span></h2>
      <p>Hugging Face's library to run transformer models in the browser with a Python-like API. Pulls ONNX models, runs on WebGPU/Wasm. Great for embeddings, classification, ASR, small LLMs.</p>
      <pre><code><span class="tok-key">import</span> { pipeline } <span class="tok-key">from</span> <span class="tok-str">'@huggingface/transformers'</span>;
<span class="tok-key">const</span> pipe = <span class="tok-key">await</span> <span class="tok-fn">pipeline</span>(<span class="tok-str">'sentiment-analysis'</span>);
<span class="tok-key">const</span> out  = <span class="tok-key">await</span> <span class="tok-fn">pipe</span>(<span class="tok-str">'Web AI is incredible'</span>); <span class="tok-com">// [{label:'POSITIVE', score:.99}]</span></code></pre>

      <h2>🦙 WebLLM <span class="pill new">The showstopper</span></h2>
      <p>By MLC — runs <strong>full LLMs entirely in-browser</strong> over WebGPU (Llama 3, Phi-3, Mistral, Qwen, Gemma). Downloads a quantized model once (cached via OPFS), then inference is fully local — works offline, nothing leaves the device. This is your "pull the wifi and it still answers" demo.</p>
      <pre><code><span class="tok-key">import</span> { CreateMLCEngine } <span class="tok-key">from</span> <span class="tok-str">'@mlc-ai/web-llm'</span>;
<span class="tok-key">const</span> engine = <span class="tok-key">await</span> <span class="tok-fn">CreateMLCEngine</span>(<span class="tok-str">'Llama-3.2-1B-Instruct-q4f32_1-MLC'</span>);
<span class="tok-key">const</span> reply = <span class="tok-key">await</span> engine.chat.completions.<span class="tok-fn">create</span>({ messages, stream:<span class="tok-key">true</span> });</code></pre>

      <h2>The rest worth naming</h2>
      <div class="grid2">
        <div class="card"><h3>⚙️ ONNX Runtime Web</h3><p style="margin:0">Microsoft's runtime. Runs any ONNX model on WebGPU/Wasm. The engine under many other libs.</p></div>
        <div class="card"><h3>📊 TensorFlow.js</h3><p style="margin:0">The veteran. Big model zoo, WebGL/WebGPU backends, good for vision.</p></div>
        <div class="card"><h3>🎯 MediaPipe</h3><p style="margin:0">Google's task runtime — face/hand/pose, segmentation, on-device LLM tasks. Drop-in "solutions."</p></div>
        <div class="card"><h3>🐍 Pyodide</h3><p style="margin:0">CPython compiled to Wasm — run numpy/scikit-learn in the browser. Niche but mind-bending.</p></div>
      </div>
      <div class="takeaway"><b>Pick by job:</b> embeddings/NLP → Transformers.js · chat LLM offline → WebLLM · arbitrary ONNX → ONNX Runtime Web · vision tasks → MediaPipe.</div>
    `
  },
  {
    id:'builtin', icon:'✨', group:'The Stack', title:'Built-in AI', live:'builtin',
    html:`
      <div class="eyebrow">Layer 3 · The browser ships a model</div>
      <h1>Built-in AI & the Prompt API</h1>
      <p class="lead">The newest, most "wow" piece. Chrome ships <strong>Gemini Nano on-device</strong> and exposes it through JS APIs — no download in your app, no server, no API key. The browser <em>is</em> the model.</p>

      <h2>The APIs</h2>
      <ul>
        <li><strong>Prompt API</strong> (<code>LanguageModel</code>) — general chat/completion against the built-in model.</li>
        <li><strong>Task APIs</strong> — <code>Summarizer</code>, <code>Writer</code>, <code>Rewriter</code>, <code>Translator</code>, <code>LanguageDetector</code>. Purpose-built, higher quality for their task.</li>
      </ul>
      <pre><code><span class="tok-com">// availability + create a session (API surface evolves — check current docs)</span>
<span class="tok-key">const</span> avail = <span class="tok-key">await</span> LanguageModel.<span class="tok-fn">availability</span>();
<span class="tok-key">const</span> session = <span class="tok-key">await</span> LanguageModel.<span class="tok-fn">create</span>();
<span class="tok-key">const</span> answer = <span class="tok-key">await</span> session.<span class="tok-fn">prompt</span>(<span class="tok-str">'Explain WebGPU in one line'</span>);
<span class="tok-com">// streaming:</span>
<span class="tok-key">for await</span> (<span class="tok-key">const</span> chunk <span class="tok-key">of</span> session.<span class="tok-fn">promptStreaming</span>(text)) { … }</code></pre>

function detectCaps(){
  const has=(c)=>{try{return !!c()}catch(e){return false}};
  return [
    ['WebGPU',()=>has(()=> 'gpu' in navigator),'navigator.gpu'],
    ['WebNN',()=>has(()=> 'ml' in navigator),'navigator.ml'],
    ['WebAssembly',()=>has(()=> typeof WebAssembly==='object'),'core Wasm'],
    ['Web Workers',()=>has(()=> typeof Worker!=='undefined'),'background threads'],
    ['SharedArrayBuffer',()=>has(()=> typeof SharedArrayBuffer!=='undefined'),'needs COOP/COEP'],
    ['Cross-origin isolated',()=>has(()=> self.crossOriginIsolated===true),'COOP+COEP set'],
    ['OPFS',()=>has(()=> navigator.storage && 'getDirectory' in navigator.storage),'private file system'],
    ['WebTransport',()=>has(()=> typeof WebTransport!=='undefined'),'HTTP/3 transport'],
    ['WebRTC',()=>has(()=> typeof RTCPeerConnection!=='undefined'),'realtime audio/video'],
    ['Server-Sent Events',()=>has(()=> typeof EventSource!=='undefined'),'token streaming'],
    ['WebCodecs',()=>has(()=> typeof VideoEncoder!=='undefined'),'video/audio frames'],
    ['Web Audio',()=>has(()=> typeof (window.AudioContext||window.webkitAudioContext)!=='undefined'),'voice I/O'],
    ['Built-in AI (Prompt)',()=>has(()=> 'LanguageModel' in self || (window.ai && (window.ai.languageModel||window.ai.assistant))),'Gemini Nano'],
    ['Service Worker',()=>has(()=> 'serviceWorker' in navigator),'offline / cache'],
    ['Cache API',()=>has(()=> 'caches' in window),'HTTP cache'],

}

// ── Live demos ──────────────────────────────────────────────────
function wireDemos(){
  const $=(id)=>document.getElementById(id);
  const set=(id,html,cls)=>{const e=$(id);if(e){e.innerHTML=html;if(cls)e.className='demo-out '+cls;else e.className='demo-out';}};

  // WebGPU compute
  if($('btn-webgpu'))$('btn-webgpu').onclick=async()=>{
    set('out-webgpu','Requesting GPU…');
    try{
      if(!('gpu' in navigator)){set('out-webgpu','❌ WebGPU not available in this browser.','err');return;}
      const adapter=await navigator.gpu.requestAdapter();
      if(!adapter){set('out-webgpu','❌ No GPU adapter.','err');return;}
      const device=await adapter.requestDevice();
      const a=new Float32Array([1,2,3,4]),b=new Float32Array([10,20,30,40]);
      const mk=(arr)=>{const buf=device.createBuffer({size:arr.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC|GPUBufferUsage.COPY_DST});device.queue.writeBuffer(buf,0,arr);return buf;};
      const bufA=mk(a),bufB=mk(b),bufOut=device.createBuffer({size:a.byteLength,usage:GPUBufferUsage.STORAGE|GPUBufferUsage.COPY_SRC});
      const read=device.createBuffer({size:a.byteLength,usage:GPUBufferUsage.COPY_DST|GPUBufferUsage.MAP_READ});
      const shader=device.createShaderModule({code:`@group(0)@binding(0) var<storage,read> a:array<f32>;@group(0)@binding(1) var<storage,read> b:array<f32>;@group(0)@binding(2) var<storage,read_write> o:array<f32>;@compute @workgroup_size(4) fn main(@builtin(global_invocation_id) gid:vec3u){o[gid.x]=a[gid.x]+b[gid.x];}`});
      const pipe=device.createComputePipeline({layout:'auto',compute:{module:shader,entryPoint:'main'}});
      const bind=device.createBindGroup({layout:pipe.getBindGroupLayout(0),entries:[{binding:0,resource:{buffer:bufA}},{binding:1,resource:{buffer:bufB}},{binding:2,resource:{buffer:bufOut}}]});
      const enc=device.createCommandEncoder();const pass=enc.beginComputePass();pass.setPipeline(pipe);pass.setBindGroup(0,bind);pass.dispatchWorkgroups(1);pass.end();
      enc.copyBufferToBuffer(bufOut,0,read,0,a.byteLength);device.queue.submit([enc.finish()]);
      await read.mapAsync(GPUMapMode.READ);const result=Array.from(new Float32Array(read.getMappedRange()));
      set('out-webgpu',`✓ GPU device acquired: ${adapter.info?.vendor||'gpu'} ${adapter.info?.architecture||''}\n\n[1,2,3,4] + [10,20,30,40]\n= [${result.join(', ')}]\n\n↑ computed on the GPU via a WGSL compute shader.`);
    }catch(err){set('out-webgpu','❌ '+err.message,'err');}
  };

  // Built-in AI detection
  if($('btn-builtin'))$('btn-builtin').onclick=async()=>{
    set('out-builtin','Detecting…');
    try{
      const lm = self.LanguageModel || (window.ai&&(window.ai.languageModel||window.ai.assistant));
      if(!lm){set('out-builtin','❌ Prompt API not found.\nEnable in Chrome: chrome://flags → "Prompt API for Gemini Nano" + "Optimization Guide On Device".','err');return;}
      let avail='unknown';
      try{ avail = (await (lm.availability? lm.availability() : lm.capabilities?.().then(c=>c.available))) ?? 'detected'; }catch(e){avail='detected';}
      set('out-builtin',`✓ Prompt API present.\nAvailability: ${avail}\n\nNext: const s = await LanguageModel.create(); await s.prompt('hi')`);
    }catch(err){set('out-builtin','❌ '+err.message,'err');}
  };

  // SSE streaming simulation
  if($('btn-sse'))$('btn-sse').onclick=()=>{
    const words='Streaming makes AI feel instant — tokens arrive one by one, so the user reads while the model writes, instead of staring at a spinner.'.split(' ');
    let i=0;set('out-sse','');const out=$('out-sse');
    const tick=()=>{ if(i>=words.length){out.innerHTML+=' <span class="muted">[done]</span>';return;} out.textContent+=(i?' ':'')+words[i++]; setTimeout(tick,90); };
    tick();
  };

  // OPFS round-trip
  if($('btn-opfs'))$('btn-opfs').onclick=async()=>{
    set('out-opfs','Writing…');
    try{
      if(!(navigator.storage&&navigator.storage.getDirectory)){set('out-opfs','❌ OPFS not available here.','err');return;}
      const root=await navigator.storage.getDirectory();
      const fh=await root.getFileHandle('waih-demo.txt',{create:true});
      const w=await fh.createWritable();const payload=`saved at ${new Date().toISOString()}`;await w.write(payload);await w.close();
      const file=await(await root.getFileHandle('waih-demo.txt')).getFile();const text=await file.text();
      let quota='';try{const est=await navigator.storage.estimate();quota=`\nQuota: ${(est.usage/1e6).toFixed(1)} MB used of ${(est.quota/1e9).toFixed(1)} GB`;}catch(e){}
      set('out-opfs',`✓ wrote → OPFS, read back:\n"${text}"${quota}`);
    }catch(err){set('out-opfs','❌ '+err.message,'err');}
  };

  // Web Worker
  if($('btn-worker'))$('btn-worker').onclick=()=>{
    set('out-worker','Spawning worker…');
    try{
      const code=`onmessage=(e)=>{let s=0;for(let i=0;i<e.data;i++){s+=Math.sqrt(i);}postMessage(s);}`;
      const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));
      const w=new Worker(url);const t=performance.now();
      w.onmessage=(e)=>{set('out-worker',`✓ Worker computed sum of sqrt(0..50,000,000)\n= ${e.data.toFixed(0)}\nin ${(performance.now()-t).toFixed(0)}ms — off the main thread (UI never froze).`);w.terminate();URL.revokeObjectURL(url);};
      w.postMessage(50000000);
    }catch(err){set('out-worker','❌ '+err.message,'err');}
  };

  // Web Audio tone
  if($('btn-audio'))$('btn-audio').onclick=()=>{
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC){set('out-audio','❌ Web Audio not available.','err');return;}
      const ctx=new AC();const osc=ctx.createOscillator();const gain=ctx.createGain();
      osc.frequency.value=440;gain.gain.value=0.08;osc.connect(gain).connect(ctx.destination);osc.start();
      setTimeout(()=>{osc.stop();},500);
      set('out-audio','✓ Played 440 Hz for 0.5s via AudioContext.\nSame rig (mic in → AudioWorklet → model → tone out) powers voice AI.');
    }catch(err){set('out-audio','❌ '+err.message,'err');}
  };
}

// init
renderNav();go('overview');updateProgress();
</script>
</body>
